<style>
*{box-sizing:border-box;margin:0;padding:0}

.in{opacity:0;transform:translateY(16px);animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{to{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.in{opacity:1;transform:none}}
.lsw{display:inline-flex;gap:2px;padding:3px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(255,255,255,.04);backdrop-filter:blur(10px)}.lsw button{all:unset;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.04em;padding:6px 10px;border-radius:999px;color:#a1a1aa;transition:background .25s,color .25s}.lsw button:hover{color:#f4f4f5}.lsw button[aria-pressed=true]{background:#f4f4f5;color:#09090b}.lsw button:focus-visible{outline:2px solid #a855f7}.lsw.top{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:5}.lsw.top.in{animation:none;opacity:1}.b{text-align:center}

<script>const I18N={"pt": {"title": "Sites para pequenas empresas", "desc": "Sites modernos, rápidos e acessíveis, criados com desenvolvimento por IA.", "wa": "Falar no WhatsApp", "svc": "Ver meus serviços", "save": "Salvar contato", "_title": "Mateus Maués — Cartão", "_desc": "Cartão de visitas virtual de Mateus Maués: sites para pequenas empresas.", "_wa": "Olá Mateus, quero um site para minha empresa"}, "en": {"title": "Websites for small businesses", "desc": "Modern, fast, affordable websites — built with AI.", "wa": "Chat on WhatsApp", "svc": "See my services", "save": "Save contact", "_title": "Mateus Maués — Digital card", "_desc": "Mateus Maués' digital business card: websites for small businesses.", "_wa": "Hi Mateus, I'd like a website for my business"}, "es": {"title": "Sitios web para pequeñas empresas", "desc": "Sitios modernos, rápidos y accesibles, creados con IA.", "wa": "Escríbeme por WhatsApp", "svc": "Ver mis servicios", "save": "Guardar contacto", "_title": "Mateus Maués — Tarjeta digital", "_desc": "Tarjeta digital de Mateus Maués: sitios web para pequeñas empresas.", "_wa": "Hola Mateus, quiero un sitio web para mi empresa"}};
let CUR="en";

const LS=["en","pt","es"];
function pickLang(){const q=new URLSearchParams(location.search).get("lang");if(q&&LS.includes(q))return q;try{const s=localStorage.getItem("lang");if(LS.includes(s))return s}catch(e){}return "en"}
function waURL(t){return "https://wa.me/5531987645976?text="+encodeURIComponent(t)}
function baseApply(l){const t=I18N[l];document.documentElement.lang=l==="pt"?"pt-BR":l;document.title=t._title;document.querySelector('meta[name=description]').content=t._desc;
document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=t[e.dataset.i]});
document.querySelectorAll(".lsw button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
try{localStorage.setItem("lang",l)}catch(e){}
const u=new URL(location.href);u.searchParams.set("lang",l);history.replaceState(null,"",u)}
document.querySelectorAll(".lsw button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
function setLang(l){CUR=l;baseApply(l);const t=I18N[l];document.getElementById('wa').href=waURL(t._wa);document.getElementById('svc').href="index.html?lang="+l}
setLang(pickLang());

document.getElementById('vc').onclick=()=>{
const v="BEGIN:VCARD\r\nVERSION:3.0\r\nN:Maués;Mateus;;;\r\nFN:Mateus Maués\r\nTITLE:"+I18N[CUR].title+"\r\nTEL;TYPE=CELL:+5531987645976\r\nEND:VCARD\r\n";
const a=document.createElement('a');a.href='data:text/vcard;charset=utf-8,'+encodeURIComponent(v);a.download='Mateus-Maues.vcf';document.body.append(a);a.click();a.remove()};
if(!matchMedia('(prefers-reduced-motion: reduce)').matches&&matchMedia('(hover:hover)').matches){const c=document.getElementById('c');
addEventListener('mousemove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;c.style.transform=`perspective(900px) rotateY(${x*6}deg) rotateX(${-y*6}deg)`})}
</script></body></html>
